# Gizlet OS: public-key logins only. gizlet-ssh copies the keys from
# authorized_keys on the FAT boot partition and provides the host key.
HostKey /run/gizlet-ssh/ssh_host_ed25519_key
AuthorizedKeysFile /run/gizlet-ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
