# Gizlet OS: root logs in with the password set in the launcher (or setup.ini),
# or with a key from authorized_keys on the FAT boot partition. gizlet-ssh
# installs both and provides the host key. Without a password, root's entry is
# locked and only keys work.
HostKey /run/gizlet-ssh/ssh_host_ed25519_key
AuthorizedKeysFile /run/gizlet-ssh/authorized_keys
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin yes
