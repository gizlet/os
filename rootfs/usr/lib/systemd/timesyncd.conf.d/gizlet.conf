# Network time from Apple's anycast servers, which answer nearby in most regions
# including mainland China; Alibaba Cloud's is tried when Apple's do not answer.
# timesyncd moves along this list on failure; FallbackNTP= (Debian's pool) is
# used only when the list is empty, so the alternate belongs here.
[Time]
NTP=time.apple.com ntp.aliyun.com
