name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        run: |
          release_tag='^v(0|[1-9][0-9]{0,8})(\.(0|[1-9][0-9]{0,8})){2}$'
          [[ "$GITHUB_REF_NAME" =~ $release_tag ]]
          commit=$(git rev-parse 'HEAD^{commit}')
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test release (R36S)
    needs: verify
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}')['linux-arm64'] || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential squashfs-tools
          if ! command -v bazel >/dev/null; then
            dir="$RUNNER_TEMP/bazelisk"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-arm64
            echo "b2bcc040c213b44586b121bda6d983c35df121b917c3a7a66fb16f2fa0df1a4f  $dir/bazel" | sha256sum -c -
            chmod +x "$dir/bazel"
            echo "$dir" >> "$GITHUB_PATH"
          fi
      - name: Build, test and stage unsigned artifacts
        env:
          BAZEL_CACHE_DIR: ${{ vars.BAZEL_CACHE_DIR }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          args=(--config=r36s)
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted && -n "$BAZEL_CACHE_DIR" ]]; then
            args+=("--disk_cache=$BAZEL_CACHE_DIR/disk" "--repository_cache=$BAZEL_CACHE_DIR/repository")
          fi
          board=//targets/sd_image/gameconsole/r36s
          bazel test "${args[@]}" --test_output=errors \
            "$board:image_test" "$board:rootfs_test" "$board:boot_test" \
            //boards/gameconsole/r36s:flash_test
          bazel build "${args[@]}" \
            "$board:gizlet-os-r36s_gz" //runtime:gizlet-runtime-1 \
            //launcher:gizlet-launcher //launcher:gizlet-cli
          mkdir -p "$RUNNER_TEMP/os-build"
          cp -L bazel-bin/targets/sd_image/gameconsole/r36s/release/gizlet-os-r36s.img.gz \
            bazel-bin/runtime/gizlet-runtime-1.sqfs \
            bazel-bin/launcher/gizlet-launcher bazel-bin/launcher/gizlet-cli \
            "$RUNNER_TEMP/os-build/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-build
          path: ${{ runner.temp }}/os-build/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true

  publish:
    name: Sign and publish to R2
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-build
          path: ${{ runner.temp }}/os-build
      - name: Install SOPS
        env:
          SOPS_VERSION: v3.13.3
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}"
          curl -fsSLO "$base/sops-${SOPS_VERSION}.linux.amd64"
          curl -fsSLO "$base/sops-${SOPS_VERSION}.checksums.txt"
          grep " sops-${SOPS_VERSION}.linux.amd64\$" "sops-${SOPS_VERSION}.checksums.txt" | sha256sum -c
          sudo install -m 0755 "sops-${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops
      - name: Assemble and upload the release
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          sops decrypt --output-type json secrets/release.enc.yaml |
            python3 scripts/release.py "$GITHUB_REF_NAME" "$RELEASE_COMMIT" \
              "$RUNNER_TEMP/os-build" "$RUNNER_TEMP/os-release"
