name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        run: |
          release_tag='^v(0|[1-9][0-9]{0,8})(\.(0|[1-9][0-9]{0,8})){2}$'
          [[ "$GITHUB_REF_NAME" =~ $release_tag ]]
          commit=$(git rev-parse 'HEAD^{commit}')
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, test and publish release (R36S)
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential squashfs-tools uidmap
          if ! unshare --user --mount --map-root-user true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare --user --mount --map-root-user true
          fi
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: release-arm64
      - name: Build, test and stage unsigned artifacts
        run: |
          board=//targets/sd_image/gameconsole/r36s
          bazel test --config=r36s --test_output=errors \
            "$board:image_test" "$board:rootfs_test" "$board:boot_test" \
            //boards/gameconsole/r36s:flash_test
          bazel build --config=r36s \
            "$board:gizlet-os-r36s_gz" //runtime:gizlet-runtime-1 \
            //launcher:gizlet-launcher //launcher:gizlet-cli
          mkdir -p "$RUNNER_TEMP/os-build"
          cp -L bazel-bin/targets/sd_image/gameconsole/r36s/release/gizlet-os-r36s.img.gz \
            bazel-bin/runtime/gizlet-runtime-1.sqfs \
            bazel-bin/launcher/gizlet-launcher bazel-bin/launcher/gizlet-cli \
            "$RUNNER_TEMP/os-build/"
      - name: Install SOPS
        env:
          SOPS_VERSION: v3.13.3
        run: |
          cd "$RUNNER_TEMP"
          binary="sops-${SOPS_VERSION}.linux.arm64"
          base="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}"
          curl -fsSLO "$base/$binary"
          curl -fsSLO "$base/sops-${SOPS_VERSION}.checksums.txt"
          awk -v file="$binary" '$2 == file' "sops-${SOPS_VERSION}.checksums.txt" | sha256sum -c
          sudo install -m 0755 "$binary" /usr/local/bin/sops
      - name: Assemble and upload the release
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          sops decrypt --output-type json devops/secrets/release.enc.yaml |
            python3 devops/scripts/release.py "$GITHUB_REF_NAME" "$RELEASE_COMMIT" \
              "$RUNNER_TEMP/os-build" "$RUNNER_TEMP/os-release"
