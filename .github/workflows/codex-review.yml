name: Codex review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head; a moved head is skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    # Every new comment starts this workflow; only one with a /codex-review line goes on.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/codex-review'))
    concurrency:
      group: codex-review-${{ inputs.pull_request_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: gizlet/.github/.github/workflows/codex-review.yml@latest
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
      review-instructions: >-
        Gizlet OS builds a read-only Linux base system and TF1 card image for the
        RK3326 R36S with Bazel. Pay particular attention to boot chain, partition
        layout, and storage contract regressions, hermeticity and reproducibility
        of Bazel rules, shell script correctness under BusyBox, and changes that
        could leave a device unbootable or lose user data on the data partition.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
