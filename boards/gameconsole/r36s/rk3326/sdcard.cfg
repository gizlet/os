# TF1 layout. The RK3326 BootROM and vendor miniloader address these stages by sector.
image boot.vfat {
    vfat {
        label = "GIZLETBOOT"
        extraargs = "--invariant -F 16 -i 36335030 -h 32768"
        files = { "boot.scr", "Image", "r36s.dtb", "rk3326-odroidgo2-linux-v11.dtb", "rk3326-odroidgo2-linux.dtb", "rk3326-odroidgo3-linux.dtb", "rk3326-anbernic-rg351v.dtb", "rk3326-gameconsole-r33s.dtb", "rk3326-magicx-xu10.dtb", "rk3326-gameforce-chi.dtb" }
    }
    size = 64M
}

image data.ext4 {
    ext4 {
        use-mke2fs = true
        label = "GIZLETDATA"
        extraargs = "-b 4096 -U 17605036-fda0-4633-a95b-2ed27409a90c -E hash_seed=bb4e4a3e-1c28-4a28-a59e-da981a02d821"
    }
    empty = true
    size = 64M
    # Populate only the new filesystem in this build directory.
    exec-post = "debugfs -w -R 'mkdir /gizlet' \"$IMAGEOUTFILE\" && debugfs -w -R 'mkdir /home' \"$IMAGEOUTFILE\""
}

image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
        disk-signature = 0x36335030
        fill = true
    }
    partition loader {
        in-partition-table = false
        offset = 32K
        image = "idbloader.img"
    }
    partition uboot {
        in-partition-table = false
        offset = 8M
        image = "uboot.img"
    }
    partition trust {
        in-partition-table = false
        offset = 12M
        image = "trust.img"
    }
    partition boot {
        bootable = true
        partition-type = 0x0e
        offset = 16M
        image = "boot.vfat"
    }
    partition root {
        partition-type = 0x83
        image = "rootfs.sqfs"
        size = 16M
    }
    partition data {
        partition-type = 0x83
        offset = 96M
        image = "data.ext4"
    }
    size = 160M
}
