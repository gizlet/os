odroidgoa-uboot-config
setenv bootargs "rdinit=/init ro console=tty0 console=ttyS2,115200n8 earlycon=uart8250,mmio32,0xff160000,115200n8 loglevel=8 ignore_loglevel printk.time=1 consoleblank=0"
setenv loadaddr "0x02000000"
setenv initrd_loadaddr "0x01100000"
setenv dtb_loadaddr "0x01f00000"
echo "Gizlet OS: loading Linux 6.12 for V30 / Panel 4"
if load mmc 1:1 ${loadaddr} gizlet-test/Image && load mmc 1:1 ${initrd_loadaddr} gizlet-test/uInitrd && load mmc 1:1 ${dtb_loadaddr} gizlet-test/board.dtb; then
    echo "Gizlet OS: starting Linux"
    booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}
fi
echo "Gizlet OS: trial load or booti failed"
