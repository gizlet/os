odroidgoa-uboot-config
setenv bootargs "rdinit=/init ro console=tty0 console=ttyFIQ0,115200n8 loglevel=8 ignore_loglevel printk.time=1 fbcon=rotate:0 consoleblank=0 max_cpufreq=1296 boot_cpufreq=1248 max_gpufreq=520 max_ddrfreq=666"
setenv loadaddr "0x02000000"
setenv initrd_loadaddr "0x01100000"
setenv dtb_loadaddr "0x01f00000"
echo "Gizlet OS: loading V30 / Panel 4 RAM trial"
if load mmc 1:1 ${loadaddr} Image && load mmc 1:1 ${initrd_loadaddr} gizlet-test/uInitrd && load mmc 1:1 ${dtb_loadaddr} rk3326-r36s-v30-linux.dtb; then
    echo "Gizlet OS: starting Linux"
    booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}
fi
echo "Gizlet OS: trial load or booti failed"
