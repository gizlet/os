# TF1 layout. The RK3326 BootROM and vendor miniloader address these stages by sector.
image boot.vfat {
    vfat {
        label = "GIZLETBOOT"
        extraargs = "--invariant -F 16 -i 36335030 -h 32768"
        files = { "boot.scr", "Image", "r36s.dtb", "r36s-v30-panel4.dtbo", "rk3326-odroidgo2-linux-v11.dtb", "rk3326-odroidgo2-linux.dtb", "rk3326-odroidgo3-linux.dtb", "rk3326-anbernic-rg351v.dtb", "rk3326-gameconsole-r33s.dtb", "rk3326-magicx-xu10.dtb", "rk3326-gameforce-chi.dtb" }
    }
    size = 64M
}

image data.ext4 {
    ext4 {
        use-mke2fs = true
        label = "GIZLETDATA"
        # The card grows this filesystem to the whole card on its first boot.
        # -i 65536: one inode per 64 KiB, not mke2fs's 4 KiB for a filesystem
        # this small, which on a 64 GB card would be 3 GB of inode tables.
        # resize: group descriptor room to grow in place up to 2 TiB.
        extraargs = "-b 4096 -i 65536 -U 17605036-fda0-4633-a95b-2ed27409a90c -E hash_seed=bb4e4a3e-1c28-4a28-a59e-da981a02d821,resize=536870912"
    }
    empty = true
    size = 128M
    # Populate only the new filesystem in this build directory: the two data
    # directories and Gizlet runtime 1 (/opt/gizlet/runtime/1.sqfs).
    exec-post = "debugfs -w -R 'mkdir /gizlet' \"$IMAGEOUTFILE\" && debugfs -w -R 'mkdir /home' \"$IMAGEOUTFILE\" && debugfs -w -R 'mkdir /gizlet/runtime' \"$IMAGEOUTFILE\" && debugfs -w -R \"write $INPUTPATH/gizlet-runtime-1.sqfs /gizlet/runtime/1.sqfs\" \"$IMAGEOUTFILE\""
}

image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
        disk-signature = 0x36335030
        fill = true
    }
    partition loader {
        in-partition-table = false
        offset = 32K
        image = "idbloader.img"
    }
    partition uboot {
        in-partition-table = false
        offset = 8M
        image = "uboot.img"
    }
    partition trust {
        in-partition-table = false
        offset = 12M
        image = "trust.img"
    }
    partition boot {
        bootable = true
        partition-type = 0x0e
        offset = 16M
        image = "boot.vfat"
    }
    partition root {
        partition-type = 0x83
        image = "rootfs.sqfs"
        size = 256M
    }
    partition data {
        partition-type = 0x83
        offset = 336M
        image = "data.ext4"
    }
    size = 464M
}
