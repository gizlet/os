# TF1 layout. The RK3326 BootROM and vendor miniloader address these stages by sector.
image boot.vfat {
    vfat {
        label = "GIZLETBOOT"
        extraargs = "--invariant -F 16 -i 36335030 -h 32768"
        files = { "boot.scr", "Image", "r36s.dtb", "rk3326-odroidgo2-linux-v11.dtb", "rk3326-odroidgo2-linux.dtb", "rk3326-odroidgo3-linux.dtb", "rk3326-anbernic-rg351v.dtb", "rk3326-gameconsole-r33s.dtb", "rk3326-magicx-xu10.dtb", "rk3326-gameforce-chi.dtb" }
    }
    size = 64M
}

image data.ext4 {
    ext4 {
        use-mke2fs = true
        label = "GIZLETDATA"
        # The card writers grow this filesystem to the whole card (flash.sh,
        # flash.ps1); a card written another way grows it on its first boot.
        # -i 65536: one inode per 64 KiB, not mke2fs's 4 KiB for a filesystem
        # this small, which on a 64 GB card would be 3 GB of inode tables.
        # meta_bg, without resize_inode: each new 64 groups keep their own group
        # descriptor block, so growing only writes new metadata and never moves
        # existing blocks. The card writers depend on this layout.
        extraargs = "-b 4096 -i 65536 -O ^resize_inode,meta_bg -U cef58f4f-a7a3-40ac-9cb3-bd8d89aab65f -E hash_seed=bb4e4a3e-1c28-4a28-a59e-da981a02d821"
    }
    empty = true
    size = 128M
    # Populate only the new filesystem in this build directory: device/, which
    # every profile shares, with Gizlet runtime 1 (device/runtime/1.sqfs), and
    # profiles/, where the first boot creates the first profile.
    exec-post = "debugfs -w -R 'mkdir /device' \"$IMAGEOUTFILE\" && debugfs -w -R 'mkdir /device/runtime' \"$IMAGEOUTFILE\" && debugfs -w -R \"write $INPUTPATH/gizlet-runtime-1.sqfs /device/runtime/1.sqfs\" \"$IMAGEOUTFILE\" && debugfs -w -R 'mkdir /profiles' \"$IMAGEOUTFILE\""
}

image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
        disk-signature = 0x36335030
        fill = true
    }
    partition loader {
        in-partition-table = false
        offset = 32K
        image = "idbloader.img"
    }
    partition uboot {
        in-partition-table = false
        offset = 8M
        image = "uboot.img"
    }
    partition trust {
        in-partition-table = false
        offset = 12M
        image = "trust.img"
    }
    partition boot {
        bootable = true
        partition-type = 0x0e
        offset = 16M
        image = "boot.vfat"
    }
    partition root {
        partition-type = 0x83
        image = "rootfs.sqfs"
        size = 256M
    }
    partition data {
        partition-type = 0x83
        offset = 336M
        image = "data.ext4"
    }
    size = 464M
}
