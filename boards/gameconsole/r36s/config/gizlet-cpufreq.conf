# schedutil may change the CPU clock once per rate_limit_us. The kernel's
# default is 1.5 times the switch latency, a fraction of a millisecond, and
# each switch sets vdd_arm over the PMIC's I2C bus: a launcher drawing at 60
# frames a second switched 150 to 200 times a second on the R36S. 10 ms still
# raises the clock within a frame. `w` writes only where the file exists, so a
# board without schedutil is left alone.
w /sys/devices/system/cpu/cpufreq/schedutil/rate_limit_us - - - - 10000
