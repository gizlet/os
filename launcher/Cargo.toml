[package]
name = "gizlet-launcher"
description = "Gizlet OS's launcher: home, settings and a button test, drawn with raylib"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
default-run = "gizlet-launcher"

[[bin]]
name = "gizlet-launcher"
path = "src/main.rs"

[[bin]]
name = "gizlet-cli"
path = "src/cli_main.rs"

[features]
# Gizlet OS: link the software-rendered DRM raylib built for the card (see
# BUILD.bazel) instead of letting raylib-sys build a desktop raylib.
gizlet-os = ["raylib-sys/nobuild"]

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
raylib-sys = "6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
